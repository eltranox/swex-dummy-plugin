name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    name: Build & release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - run: npm run build

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: plugin
          path: |
            dist/*.asar
            dist/latest.yml

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" dist/*.asar dist/latest.yml --title "$GITHUB_REF_NAME" --generate-notes --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
